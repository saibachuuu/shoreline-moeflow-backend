; 单容器多进程编排：notification / security_email / beat。
;
; 为什么不是「一个 worker 订阅三个队列」：
;   * default 队列里有 time_limit=1200 的文本解析任务，notification_scan 只有
;     180 秒预算，security_email 只有 35 秒预算；合并成一个 worker 会让验证码
;     邮件排在长任务之后，用户等很久才收到。
;   * beat 必须保持单实例，且本环境实测 embedded beat（worker --beat）会静默
;     失效，所以固定为独立进程。
;
; 三个 program 共享同一份 Python 代码与镜像层，但各自是独立进程，
; prefork 子进程数与超时隔离互不影响。
;
; 由 deploy/Dockerfile 复制到 /etc/supervisor/conf.d/moeflow.conf，
; 启动命令：supervisord -c /etc/supervisor/conf.d/moeflow.conf

[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

; 运维入口：docker exec <容器> supervisorctl -c /etc/supervisor/conf.d/moeflow.conf status
[unix_http_server]
file=/tmp/supervisor.sock
chmod=0700

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[program:notification]
environment=APP_ROLE="worker"
; 并发数从环境变量读取（默认 2）。改 .env 里的 CELERY_NOTIFICATION_CONCURRENCY
; 后 docker compose up -d 即可生效，不需要重建镜像。
command=/bin/sh -c 'exec celery --app app.celery worker --queues notification --hostname celery.notification --loglevel=info --concurrency=${CELERY_NOTIFICATION_CONCURRENCY:-2} --prefetch-multiplier=1'
directory=/app
autostart=true
autorestart=true
startsecs=5
startretries=5
stopasgroup=true
killasgroup=true
stopwaitsecs=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:security-email]
environment=APP_ROLE="worker"
command=/bin/sh -c 'exec celery --app app.celery worker --queues security_email --hostname celery.security_email --loglevel=info --concurrency=${CELERY_SECURITY_EMAIL_CONCURRENCY:-1} --prefetch-multiplier=1'
directory=/app
autostart=true
autorestart=true
startsecs=5
startretries=5
stopasgroup=true
killasgroup=true
stopwaitsecs=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:beat]
environment=APP_ROLE="beat"
command=celery --app app.celery beat --loglevel=info --schedule=/app/celerybeat/celerybeat-schedule
directory=/app
autostart=true
autorestart=true
startsecs=5
startretries=5
stopasgroup=true
killasgroup=true
stopwaitsecs=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
