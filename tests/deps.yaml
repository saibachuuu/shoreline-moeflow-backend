# Test dependencies for moeflow-backend
# Database tests run in-memory via mongomock. CI no longer starts rabbitmq:
# no test calls .delay()/apply_async, and .env.test.sample points CELERY_BROKER_URL
# at memory://. Kept for anyone running celery tasks locally against a broker.
version: '3.3'
services:
  moeflow-rabbitmq:
    environment:
      RABBITMQ_DEFAULT_PASS: CHANGE_ME
      RABBITMQ_DEFAULT_USER: moeflow
      RABBITMQ_DEFAULT_VHOST: moeflow
    healthcheck:
      test:
        - CMD-SHELL
        - rabbitmq-diagnostics -q ping
      timeout: 5s
      interval: 5s
      start_period: 10s
    image: docker.io/rabbitmq:3.8.9-management
    ports:
      - 127.0.0.1:5672:5672 # AMQP
      - 127.0.0.1:15672:15672 # management UI
    restart: unless-stopped
